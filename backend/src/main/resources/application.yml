server:
  port: 8080

spring:
  application:
    name: netflix-clone
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/netflixclone}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

logging:
  level:
    com.lyon.netflixclone: INFO
